name: release

# Tags only. main is covered by ci.yml; this workflow is what ships.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:   # re-deploy the current tag without cutting a new one

permissions:
  contents: read
  packages: write      # pushing to GHCR

# One deploy at a time. Two overlapping releases would race on the server.
concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # A tag can be cut from any commit, so the gates run again here rather than
  # trusting that main was green. `make check` mirrors ci.yml gate-for-gate
  # (operations/ci.md); the per-gate breakdown lives there, not in the release.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Check
        run: make check

  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The toolchain stamps info.Main.Version from VCS metadata, so the
          # build needs real history and the tag — not a depth-1 checkout.
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          # The server is arm64. A Mac is too, so this one platform also runs
          # locally. No QEMU: the Dockerfile cross-compiles and its runtime
          # stage has no RUN instruction.
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          # Via the environment, never interpolated into the shell command:
          # a tag name is attacker-supplied text.
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # The tag reaches a remote shell below, so it is checked against a
          # strict shape first. Git permits characters that would otherwise be
          # metacharacters there.
          printf '%s' "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "refusing to deploy malformed tag: $TAG"; exit 1; }

          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pinned host key. Without this, the first connection would accept
          # whatever answers on port 22.
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes \
              "${DEPLOY_USER}@${DEPLOY_HOST}" \
              "IMAGE_TAG='${TAG#v}' bash -s" <<'REMOTE'
          set -euo pipefail
          cd /opt/baseline-reference

          # The pinned tag is the deployment record: rollback is editing this
          # file back to the previous value and running `docker compose up -d`.
          printf 'IMAGE_TAG=%s\n' "$IMAGE_TAG" > .env

          docker compose pull
          docker compose up -d --remove-orphans

          # Fail the deploy if the new container never reports healthy, rather
          # than reporting success and leaving a broken app running.
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' baseline-reference 2>/dev/null || echo starting)
            [ "$status" = healthy ] && { echo "healthy after $((i * 10))s"; break; }
            [ "$i" = 30 ] && { echo "never became healthy: $status"; docker compose logs --tail=50; exit 1; }
            sleep 10
          done

          docker image prune -f
          REMOTE
