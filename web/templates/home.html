{{define "title"}}Home{{end}}

{{define "main"}}
<h1>Tic-Tac-Toe</h1>
<p>Two players, one board. X goes first.</p>
<form method="post" action="/games">
  <!-- The icon decorates a labeled control, so it is hidden from assistive
       technology and the button text carries the name (css-icons.md rule 1). -->
  <button class="button-primary">
    <span class="icon icon-plus" aria-hidden="true"></span>
    Start a new game
  </button>
</form>
{{end}}
