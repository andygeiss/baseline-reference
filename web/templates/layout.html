<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="htmx-config" content='{"includeIndicatorStyles":false,
    "globalViewTransitions":true,
    "historyCacheSize":0,"refreshOnHistoryMiss":true,"responseHandling":[
    {"code":"204","swap":false},
    {"code":"[23]..","swap":true},
    {"code":"422","swap":true},
    {"code":"[45]..","swap":false,"error":true}]}'>
  <title>{{template "title" .}} · Tic-Tac-Toe</title>
  <link rel="stylesheet" href="/static/css/app.css?v={{version}}">
  <link rel="icon" href="/static/favicon.svg?v={{version}}" type="image/svg+xml">
  <link rel="manifest" href="/static/manifest.webmanifest?v={{version}}">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png?v={{version}}">
  <meta name="theme-color" content="#fbfcfd" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
</head>
<body hx-boost="true">
  <header class="site-header">
    <nav>
      <a href="/">Tic-Tac-Toe</a>
    </nav>
  </header>
  <main>
    {{template "main" .}}
  </main>
  <footer class="site-footer">
    <p>Server-rendered with Go + htmx — no JavaScript written.</p>
  </footer>
  <script src="/static/js/htmx.min.js?v={{version}}"></script>
</body>
</html>
